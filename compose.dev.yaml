# Overlay source mounts only in development; production images remain immutable.
services:
  api:
    build:
      target: development
    command: [uvicorn, "app.main:create_app", --factory, --host, 0.0.0.0, --port, "8000", --reload]
    volumes: ["./backend/app:/app/app"]
  web:
    build:
      target: development
    ports: ["127.0.0.1:5173:5173"]
    volumes: ["./frontend/src:/app/src"]
    environment:
      VITE_PROXY_TARGET: http://api:8000
