name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridpulse_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # These credentials exist only inside the ephemeral CI database service.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gridpulse_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gridpulse_test
      JWT_SECRET: ephemeral-ci-signing-key-never-used-for-deployment
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock -e .
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: Verify migration round trip and model drift
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          python -m app.seed
          python -m app.seed
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_BASE_PATH: /gridpulse-python-saas/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - run: pip install pip-audit && pip-audit -r backend/requirements-dev.lock
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: frontend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
      # Validation has no AWS credentials and cannot create resources.
      - run: terraform fmt -check -recursive
        working-directory: infra/aws
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/aws

  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - run: python3 scripts/configure_local.py
      - run: docker compose up --build -d
      - name: Wait for migrated API
        run: curl --retry 40 --retry-delay 3 --retry-all-errors --fail http://127.0.0.1:8001/health/ready
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env: {E2E_BASE_URL: 'http://127.0.0.1:8080'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  pages:
    # Never publish a dashboard without an explicitly configured external API.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VITE_API_URL != ''
    needs: [backend, frontend, dependency-security, infrastructure, container-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - id: deployment
        uses: actions/deploy-pages@v4

  render-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, dependency-security, infrastructure, container-integration]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the configured Render deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" >/dev/null
